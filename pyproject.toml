[project]
name = "auditoria-eleicao-2026"
version = "0.1.0"
description = "Análise do comportamento eleitoral e auditoria estatística das Eleições 2026 a partir de dados oficiais do TSE"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "cryptography>=42",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]
dev = ["pytest>=8"]
gcp = ["google-cloud-storage>=2.16", "google-cloud-bigquery>=3.25"]

[project.scripts]
tse = "tse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tse"]
